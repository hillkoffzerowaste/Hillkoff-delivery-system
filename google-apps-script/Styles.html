<style>
  :root {
    --bg: #f4f7f4;
    --surface: #ffffff;
    --surface-soft: #eef5ef;
    --text: #17231a;
    --muted: #657268;
    --line: #d9e3db;
    --green: #14783d;
    --green-dark: #0d5e30;
    --amber: #a16207;
    --red: #b42318;
    --blue: #1d4ed8;
    --shadow: 0 10px 28px rgba(21, 40, 25, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 22px clamp(16px, 4vw, 40px);
    background: #0f2f1d;
    color: #fff;
  }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 13px;
    color: #b7dfc4;
    text-transform: uppercase;
    letter-spacing: 0;
  }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 4px; font-size: clamp(24px, 4vw, 36px); }
  h2 { margin-bottom: 0; font-size: 22px; }
  h3 { margin-bottom: 0; font-size: 17px; }
  .muted { color: var(--muted); }
  .topbar .muted { color: #cbd8cf; margin-bottom: 0; }
  .top-actions, .form-actions {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  button, a.primary, a.secondary {
    border: 0;
    border-radius: 8px;
    min-height: 42px;
    padding: 10px 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  .primary {
    background: var(--green);
    color: #fff;
  }
  .primary:hover { background: var(--green-dark); }
  .secondary {
    background: #e8efe9;
    color: var(--green-dark);
  }
  .topbar .secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 12px clamp(16px, 4vw, 40px);
    background: #fff;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .tab {
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
  }
  .tab.active {
    background: var(--surface-soft);
    color: var(--green-dark);
  }
  main { padding: 22px clamp(16px, 4vw, 40px) 42px; }
  .range-bar {
    display: grid;
    grid-template-columns: minmax(160px, 220px) minmax(160px, 220px) 1fr;
    gap: 12px;
    align-items: end;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .range-bar label { margin-bottom: 0; }
  .range-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: flex-end;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .section-head, .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin: 18px 0 12px;
  }
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(140px, 1fr));
    gap: 12px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    box-shadow: var(--shadow);
    min-height: 104px;
  }
  .kpi span {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 8px;
  }
  .kpi strong {
    display: block;
    font-size: 28px;
    line-height: 1.1;
  }
  .kpi small {
    display: block;
    margin-top: 8px;
    color: var(--muted);
  }
  .grid-two {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px;
    margin-top: 18px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    box-shadow: var(--shadow);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 5px 10px;
    background: var(--surface-soft);
    color: var(--green-dark);
    font-weight: 700;
    font-size: 12px;
  }
  .pill.danger { background: #fee4e2; color: var(--red); }
  .list {
    display: grid;
    gap: 8px;
  }
  .list-item {
    display: grid;
    gap: 4px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #f8faf8;
    border: 1px solid var(--line);
  }
  .list-item b { font-size: 14px; }
  .list-item small { color: var(--muted); }
  .list-item.warning { border-left: 4px solid var(--amber); }
  .list-item.danger { border-left: 4px solid var(--red); }
  .list-item.info { border-left: 4px solid var(--blue); }
  .alert-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }
  .editor-panel { margin-bottom: 14px; }
  .filters {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(160px, 220px);
    gap: 10px;
    margin-bottom: 12px;
  }
  input, select, textarea {
    width: 100%;
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font: inherit;
    background: #fff;
    color: var(--text);
  }
  textarea { resize: vertical; }
  label {
    display: grid;
    gap: 6px;
    margin-bottom: 12px;
    font-weight: 700;
    color: #314136;
  }
  .table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    box-shadow: var(--shadow);
  }
  .table-wrap.compact { max-height: 520px; }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 840px;
  }
  th, td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    font-size: 13px;
  }
  th {
    position: sticky;
    top: 0;
    background: #e8efe9;
    color: #233528;
    z-index: 1;
  }
  td .row-actions {
    display: flex;
    gap: 6px;
  }
  .mini {
    min-height: 32px;
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 12px;
  }
  .toast {
    position: fixed;
    right: 16px;
    bottom: 16px;
    max-width: min(420px, calc(100vw - 32px));
    background: #102f1e;
    color: #fff;
    border-radius: 8px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
    display: none;
    z-index: 20;
  }
  .toast.show { display: block; }
  .toast.error { background: var(--red); }
  .loading {
    position: fixed;
    inset: 0;
    background: rgba(244, 247, 244, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    z-index: 15;
  }
  .loading.show { display: flex; }
  @media (max-width: 980px) {
    .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-two { grid-template-columns: 1fr; }
    .range-bar { grid-template-columns: 1fr 1fr; }
    .range-actions { grid-column: 1 / -1; justify-content: flex-start; }
    .alert-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .topbar { align-items: stretch; flex-direction: column; }
    .top-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .filters { grid-template-columns: 1fr; }
    .range-bar { grid-template-columns: 1fr; }
    .range-actions { display: grid; grid-template-columns: 1fr 1fr; }
    .kpi-grid { grid-template-columns: 1fr; }
    table { min-width: 760px; }
  }
</style>
