<script>
  let dashboard = {
    vehicles: [],
    drivers: [],
    usageRows: [],
    fuelRows: [],
    dailySummary: [],
    monthlySummary: [],
    rankings: {},
    alerts: [],
    systemHealth: {},
    kpis: { today: {}, month: {} }
  };
  let chartMode = "daily";
  let overviewCharts = {};

  document.addEventListener("DOMContentLoaded", () => {
    initDateRange();
    refreshDashboard();
  });

  function refreshDashboard() {
    updateWorkflowStatus("กำลังโหลดข้อมูลจาก Sheet...");
    setLoading(true);
    google.script.run
      .withSuccessHandler((data) => {
        setLoading(false);
        if (!data || data.ok === false) {
          toast(data?.error || "โหลดข้อมูลไม่สำเร็จ", true);
          updateWorkflowStatus("โหลดข้อมูลไม่สำเร็จ");
          return;
        }
        dashboard = data;
        renderAll();
        updateWorkflowStatus("ข้อมูลพร้อมใช้งาน");
      })
      .withFailureHandler((error) => {
        setLoading(false);
        toast(error?.message || String(error), true);
        updateWorkflowStatus("โหลดข้อมูลไม่สำเร็จ");
      })
      .getWebDashboardData(getDateFilters());
  }

  function renderAll() {
    document.getElementById("updatedAt").textContent = `ข้อมูลล่าสุดจาก Sheet: ${dashboard.updatedAt || "-"}`;
    document.getElementById("todayLabel").textContent = dashboard.today || "";
    document.getElementById("monthLabel").textContent = `${dashboard.filters?.dateFrom || ""} ถึง ${dashboard.filters?.dateTo || ""}`;
    document.getElementById("sheetLink").href = dashboard.sheetUrl || "#";
    renderKpis("todayKpis", dashboard.kpis.today || {}, [
      ["vehicles", "รถใช้งาน", "คัน"],
      ["drivers", "คนขับ", "คน"],
      ["distance", "ระยะทาง", "กม."],
      ["fuelAmount", "ค่าน้ำมัน", "บาท"],
      ["openItems", "ยังไม่จบงาน", "รายการ"]
    ]);
    renderKpis("monthKpis", dashboard.kpis.range || dashboard.kpis.month || {}, [
      ["distance", "ระยะทางรวม", "กม."],
      ["fuelAmount", "ค่าน้ำมันรวม", "บาท"],
      ["fuelLiters", "น้ำมันรวม", "ลิตร"],
      ["bahtPerKm", "บาท/กม.", ""],
      ["kmPerLiter", "กม./ลิตร", ""]
    ]);
    fillFormOptions();
    populateTableFilters();
    renderAlerts();
    renderAlertsTable();
    renderRankings();
    renderUsageTable();
    renderFuelTable();
    renderReports();
    renderSystemHealth();
    renderOverviewCharts();
  }

  function renderKpis(targetId, source, items) {
    document.getElementById(targetId).innerHTML = items.map(([key, label, unit]) => `
      <div class="kpi">
        <span>${escapeHtml(label)}</span>
        <strong>${formatNumber(source[key])}</strong>
        <small>${escapeHtml(unit)}</small>
      </div>
    `).join("");
  }

  function updateWorkflowStatus(message) {
    const el = document.getElementById("workflowStatus");
    if (el) el.textContent = `สถานะ: ${message}`;
  }

  function setChartMode(mode) {
    chartMode = mode;
    document.querySelectorAll(".chart-mode").forEach((button) => {
      button.classList.toggle("active", button.dataset.chartMode === mode);
    });
    renderOverviewCharts();
  }

  function renderOverviewCharts() {
    const notice = document.getElementById("chartUnavailable");
    if (!document.getElementById("trendChart")) return;
    if (typeof Chart === "undefined") {
      if (notice) {
        notice.textContent = "โหลดไลบรารีกราฟไม่สำเร็จ กรุณาลองรีเฟรชหน้า";
        notice.classList.add("show");
      }
      return;
    }
    if (notice) notice.classList.remove("show");
    destroyOverviewCharts();

    const periodRows = buildPeriodAnalytics(chartMode);
    const vehicleRows = buildVehicleAnalytics();
    const qualityRows = buildDataQualityRows();
    const labels = periodRows.map((row) => row.label);

    overviewCharts.trend = createChart("trendChart", {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            type: "line",
            label: "ระยะทาง (กม.)",
            data: periodRows.map((row) => row.distance),
            borderColor: "#14783d",
            backgroundColor: "rgba(20, 120, 61, 0.12)",
            borderWidth: 2,
            tension: 0.28,
            yAxisID: "y"
          },
          {
            type: "bar",
            label: "ค่าน้ำมัน (บาท)",
            data: periodRows.map((row) => row.fuelAmount),
            backgroundColor: "rgba(161, 98, 7, 0.28)",
            borderColor: "#a16207",
            borderWidth: 1,
            yAxisID: "y1"
          }
        ]
      },
      options: chartOptions({
        scales: {
          y: { beginAtZero: true, title: { display: true, text: "กม." } },
          y1: { beginAtZero: true, position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: "บาท" } }
        }
      })
    });

    overviewCharts.fuelLiter = createChart("fuelLiterChart", {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "ลิตร",
          data: periodRows.map((row) => row.fuelLiters),
          backgroundColor: "rgba(37, 99, 235, 0.26)",
          borderColor: "#2563eb",
          borderWidth: 1
        }]
      },
      options: chartOptions()
    });

    overviewCharts.vehicleDistance = createChart("vehicleDistanceChart", horizontalBarConfig(
      vehicleRows.slice().sort((a, b) => b.distance - a.distance).slice(0, 10),
      "distance",
      "กม.",
      "#14783d"
    ));

    overviewCharts.vehicleFuel = createChart("vehicleFuelChart", horizontalBarConfig(
      vehicleRows.slice().sort((a, b) => b.fuelAmount - a.fuelAmount).slice(0, 10),
      "fuelAmount",
      "บาท",
      "#a16207"
    ));

    overviewCharts.vehicleCost = createChart("vehicleCostChart", horizontalBarConfig(
      vehicleRows.filter((row) => row.bahtPerKm > 0).sort((a, b) => b.bahtPerKm - a.bahtPerKm).slice(0, 10),
      "bahtPerKm",
      "บาท/กม.",
      "#2563eb"
    ));

    overviewCharts.dataQuality = createChart("dataQualityChart", {
      type: "doughnut",
      data: {
        labels: qualityRows.map((row) => row.label),
        datasets: [{
          data: qualityRows.map((row) => row.value),
          backgroundColor: ["#14783d", "#a16207", "#b42318", "#2563eb"],
          borderColor: "#ffffff",
          borderWidth: 2
        }]
      },
      options: chartOptions({ cutout: "62%" })
    });
  }

  function destroyOverviewCharts() {
    Object.values(overviewCharts).forEach((chart) => {
      if (chart && typeof chart.destroy === "function") chart.destroy();
    });
    overviewCharts = {};
  }

  function createChart(canvasId, config) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return null;
    try {
      return new Chart(canvas, config);
    } catch (error) {
      console.error(`Chart render failed: ${canvasId}`, error);
      const notice = document.getElementById("chartUnavailable");
      if (notice) {
        notice.textContent = "แสดงกราฟบางส่วนไม่สำเร็จ แต่ข้อมูลหลักยังใช้งานได้";
        notice.classList.add("show");
      }
      return null;
    }
  }

  function chartOptions(extra) {
    const base = {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 12, boxHeight: 12 } },
        tooltip: {
          callbacks: {
            label: (context) => `${context.dataset.label || context.label}: ${formatNumber(context.parsed.y ?? context.parsed.x ?? context.parsed)}`
          }
        }
      },
      scales: {
        x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } },
        y: { beginAtZero: true }
      }
    };
    return mergeChartOptions(base, extra || {});
  }

  function mergeChartOptions(base, extra) {
    return {
      ...base,
      ...extra,
      plugins: { ...(base.plugins || {}), ...(extra.plugins || {}) },
      scales: { ...(base.scales || {}), ...(extra.scales || {}) }
    };
  }

  function horizontalBarConfig(rows, metric, unit, color) {
    return {
      type: "bar",
      data: {
        labels: rows.map((row) => row.label),
        datasets: [{
          label: unit,
          data: rows.map((row) => row[metric]),
          backgroundColor: chartColor(color, 0.26),
          borderColor: color,
          borderWidth: 1
        }]
      },
      options: chartOptions({
        indexAxis: "y",
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true },
          y: { ticks: { autoSkip: false } }
        }
      })
    };
  }

  function buildPeriodAnalytics(mode) {
    const map = {};
    (dashboard.usageRows || []).forEach((row) => {
      const key = periodKey(row.serviceDate, mode);
      if (!key) return;
      const item = ensurePeriodItem(map, key);
      item.distance += Number(usageDistance(row) || 0);
      item.records += 1;
    });
    (dashboard.fuelRows || []).forEach((row) => {
      const key = periodKey(row.serviceDate, mode);
      if (!key) return;
      const item = ensurePeriodItem(map, key);
      item.fuelAmount += Number(row.amount || 0);
      item.fuelLiters += Number(row.liters || 0);
    });
    return Object.values(map).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  }

  function ensurePeriodItem(map, key) {
    if (!map[key.sortKey]) {
      map[key.sortKey] = { label: key.label, sortKey: key.sortKey, distance: 0, fuelAmount: 0, fuelLiters: 0, records: 0 };
    }
    return map[key.sortKey];
  }

  function periodKey(value, mode) {
    if (!value) return null;
    const parts = String(value).slice(0, 10).split("-");
    if (parts.length !== 3) return null;
    const year = Number(parts[0]);
    const month = Number(parts[1]);
    const day = Number(parts[2]);
    if (!year || !month || !day) return null;
    if (mode === "monthly") {
      const sortKey = `${year}-${String(month).padStart(2, "0")}`;
      return { sortKey, label: sortKey };
    }
    const date = new Date(year, month - 1, day);
    if (Number.isNaN(date.getTime())) return null;
    if (mode === "weekly") {
      const monday = new Date(date);
      const dayIndex = (monday.getDay() + 6) % 7;
      monday.setDate(monday.getDate() - dayIndex);
      const sortKey = formatDateInput(monday);
      return { sortKey, label: `สัปดาห์ ${sortKey}` };
    }
    const sortKey = formatDateInput(date);
    return { sortKey, label: sortKey };
  }

  function buildVehicleAnalytics() {
    const map = {};
    (dashboard.usageRows || []).forEach((row) => {
      const key = row.plate || row.assetCode || "ไม่ระบุรถ";
      const item = ensureVehicleItem(map, key);
      item.distance += Number(usageDistance(row) || 0);
      item.usageRecords += 1;
    });
    (dashboard.fuelRows || []).forEach((row) => {
      const key = row.plate || row.assetCode || "ไม่ระบุรถ";
      const item = ensureVehicleItem(map, key);
      item.fuelAmount += Number(row.amount || 0);
      item.fuelLiters += Number(row.liters || 0);
      item.fuelRecords += 1;
    });
    return Object.values(map).map((item) => ({
      ...item,
      bahtPerKm: item.distance > 0 ? item.fuelAmount / item.distance : 0
    }));
  }

  function ensureVehicleItem(map, key) {
    if (!map[key]) {
      map[key] = { label: key, distance: 0, fuelAmount: 0, fuelLiters: 0, usageRecords: 0, fuelRecords: 0 };
    }
    return map[key];
  }

  function buildDataQualityRows() {
    const usageRows = dashboard.usageRows || [];
    const ended = usageRows.filter((row) => row.eventType === "end").length;
    const starts = usageRows.filter((row) => row.eventType === "start").length;
    const segments = usageRows.filter((row) => row.eventType === "segment").length;
    const alerts = (dashboard.alerts || []).length;
    return [
      { label: "จบงาน", value: ended },
      { label: "เริ่ม/ระหว่างวัน", value: starts + segments },
      { label: "ต้องตรวจ", value: alerts },
      { label: "บิลน้ำมัน", value: (dashboard.fuelRows || []).length }
    ].filter((row) => row.value > 0);
  }

  function chartColor(hex, alpha) {
    const clean = hex.replace("#", "");
    const bigint = parseInt(clean, 16);
    const r = (bigint >> 16) & 255;
    const g = (bigint >> 8) & 255;
    const b = bigint & 255;
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function renderAlerts() {
    const alerts = dashboard.alerts || [];
    document.getElementById("alertCount").textContent = alerts.length;
    document.getElementById("alertsList").innerHTML = alerts.length ? alerts.slice(0, 12).map((item) => `
      <div class="list-item ${escapeHtml(item.type || "info")}">
        <b>${escapeHtml(item.title || "-")}</b>
        <small>${escapeHtml(item.detail || "")}</small>
      </div>
    `).join("") : `<div class="list-item"><b>ไม่มีรายการแจ้งเตือน</b><small>ข้อมูลล่าสุดปกติ</small></div>`;
  }

  function renderAlertsTable() {
    const alerts = dashboard.alerts || [];
    document.getElementById("alertsTable").innerHTML = alerts.length ? alerts.map((item) => `
      <div class="list-item ${escapeHtml(item.type || "info")}">
        <b>${escapeHtml(item.title || "-")}</b>
        <small>${escapeHtml(item.detail || "")}</small>
      </div>
    `).join("") : `<div class="list-item"><b>ไม่มีรายการที่ต้องตรวจ</b><small>ช่วงวันที่นี้ไม่พบความผิดปกติ</small></div>`;
  }

  function renderRankings() {
    const groups = [
      ["รถระยะทางสูงสุด", dashboard.rankings?.vehicleDistance || [], "กม."],
      ["คนขับระยะทางสูงสุด", dashboard.rankings?.driverDistance || [], "กม."],
      ["รถค่าน้ำมันสูงสุด", dashboard.rankings?.vehicleFuelAmount || [], "บาท"]
    ];
    document.getElementById("rankingList").innerHTML = groups.map(([title, rows, unit]) => `
      <div class="list-item">
        <b>${escapeHtml(title)}</b>
        <small>${rows.length ? rows.map((r) => `${escapeHtml(r.label)}: ${formatNumber(r.value)} ${unit}`).join(" | ") : "ยังไม่มีข้อมูล"}</small>
      </div>
    `).join("");
  }

  function populateTableFilters() {
    populateSelect("usageVehicleFilter", uniqueValues(dashboard.usageRows || [], rowVehicleKey), "รถทุกคัน");
    populateSelect("usageDriverFilter", uniqueValues(dashboard.usageRows || [], rowDriverKey), "คนขับทั้งหมด");
    populateSelect("usageDepartmentFilter", uniqueValues(dashboard.usageRows || [], rowDepartment), "ทุกแผนก");
    populateSelect("fuelVehicleFilter", uniqueValues(dashboard.fuelRows || [], rowVehicleKey), "รถทุกคัน");
    populateSelect("fuelDriverFilter", uniqueValues(dashboard.fuelRows || [], rowDriverKey), "คนขับทั้งหมด");
    populateSelect("fuelDepartmentFilter", uniqueValues(dashboard.fuelRows || [], rowDepartment), "ทุกแผนก");
  }

  function populateSelect(id, values, allLabel) {
    const el = document.getElementById(id);
    if (!el) return;
    const previous = el.value;
    el.innerHTML = `<option value="">${escapeHtml(allLabel)}</option>` + values.map((value) => `<option value="${escapeAttr(value)}">${escapeHtml(value)}</option>`).join("");
    if (previous && values.includes(previous)) el.value = previous;
  }

  function uniqueValues(rows, getter) {
    return Array.from(new Set(rows.map(getter).filter(Boolean))).sort((a, b) => String(a).localeCompare(String(b), "th"));
  }

  function rowDepartment(row) {
    if (row.department) return row.department;
    const vehicle = findVehicle(row.assetCode || row.vehicleId || row.plate);
    return (vehicle && vehicle.department) || "";
  }

  function rowVehicleKey(row) {
    return row.plate || row.assetCode || row.vehicleId || "";
  }

  function rowDriverKey(row) {
    return row.driverName || row.driverId || "";
  }

  function clearUsageFilters() {
    ["usageSearch", "usageVehicleFilter", "usageDriverFilter", "usageDepartmentFilter", "usageStatus"].forEach(clearFilterValue);
    renderUsageTable();
  }

  function clearFuelFilters() {
    ["fuelSearch", "fuelVehicleFilter", "fuelDriverFilter", "fuelDepartmentFilter"].forEach(clearFilterValue);
    renderFuelTable();
  }

  function clearFilterValue(id) {
    const el = document.getElementById(id);
    if (el) el.value = "";
  }

  function renderUsageTable() {
    const q = lower(document.getElementById("usageSearch")?.value);
    const status = document.getElementById("usageStatus")?.value || "";
    const vehicle = document.getElementById("usageVehicleFilter")?.value || "";
    const driver = document.getElementById("usageDriverFilter")?.value || "";
    const department = document.getElementById("usageDepartmentFilter")?.value || "";
    const rows = (dashboard.usageRows || []).filter((row) => {
      if (status && row.eventType !== status) return false;
      if (vehicle && rowVehicleKey(row) !== vehicle) return false;
      if (driver && rowDriverKey(row) !== driver) return false;
      if (department && rowDepartment(row) !== department) return false;
      return !q || lower(Object.values(row).join(" ")).includes(q);
    }).slice(0, 300);
    document.getElementById("usageTable").innerHTML = rows.map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate || row.assetCode)}</td>
        <td>${escapeHtml(row.driverName || row.driverId)}</td>
        <td>${escapeHtml(eventLabel(row.eventType))}</td>
        <td>${formatNumber(row.odometer)}</td>
        <td>${formatNumber(row.odometerStart)}</td>
        <td>${escapeHtml(row.usageType || row.detail || row.note)}</td>
        <td><div class="row-actions"><button class="secondary mini" type="button" onclick="editUsage('${escapeAttr(row.id)}')">แก้ไข</button></div></td>
      </tr>
    `).join("") || emptyRow(8);
  }

  function renderFuelTable() {
    const q = lower(document.getElementById("fuelSearch")?.value);
    const vehicle = document.getElementById("fuelVehicleFilter")?.value || "";
    const driver = document.getElementById("fuelDriverFilter")?.value || "";
    const department = document.getElementById("fuelDepartmentFilter")?.value || "";
    const rows = (dashboard.fuelRows || []).filter((row) => {
      if (vehicle && rowVehicleKey(row) !== vehicle) return false;
      if (driver && rowDriverKey(row) !== driver) return false;
      if (department && rowDepartment(row) !== department) return false;
      return !q || lower(Object.values(row).join(" ")).includes(q);
    }).slice(0, 300);
    document.getElementById("fuelTable").innerHTML = rows.map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate || row.assetCode)}</td>
        <td>${escapeHtml(row.driverName || row.driverId)}</td>
        <td>${formatNumber(row.odometer)}</td>
        <td>${formatNumber(row.liters)}</td>
        <td>${formatNumber(row.amount)}</td>
        <td>${escapeHtml(row.station)}</td>
        <td>${escapeHtml(row.receiptNo)}</td>
        <td><div class="row-actions"><button class="secondary mini" type="button" onclick="editFuel('${escapeAttr(row.id)}')">แก้ไข</button></div></td>
      </tr>
    `).join("") || emptyRow(9);
  }

  function renderReports() {
    renderReportSummaryCards();
    document.getElementById("dailyReport").innerHTML = (dashboard.dailySummary || []).slice(0, 150).map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate)}</td>
        <td>${escapeHtml(row.driverName)}</td>
        <td>${formatNumber(row.distance)}</td>
        <td>${formatNumber(row.fuelAmount)}</td>
        <td>${escapeHtml(row.status)}</td>
      </tr>
    `).join("") || emptyRow(6);
    document.getElementById("monthlyReport").innerHTML = (dashboard.monthlySummary || []).slice(0, 150).map((row) => `
      <tr>
        <td>${escapeHtml(row.month)}</td>
        <td>${escapeHtml(row.plate)}</td>
        <td>${escapeHtml(row.driverName)}</td>
        <td>${formatNumber(row.workingDays)}</td>
        <td>${formatNumber(row.distance)}</td>
        <td>${formatNumber(row.fuelAmount)}</td>
      </tr>
    `).join("") || emptyRow(6);
  }

  function renderReportSummaryCards() {
    const target = document.getElementById("reportSummaryCards");
    if (!target) return;
    const kpi = dashboard.kpis?.range || dashboard.kpis?.month || {};
    const usageCount = (dashboard.usageRows || []).length;
    const fuelCount = (dashboard.fuelRows || []).length;
    const alertCount = (dashboard.alerts || []).length;
    const cards = [
      ["ระยะทางรวม", formatNumber(kpi.distance), "กม."],
      ["ค่าน้ำมันรวม", formatNumber(kpi.fuelAmount), "บาท"],
      ["บันทึกการใช้รถ", formatNumber(usageCount), "รายการ"],
      ["บิลน้ำมัน", formatNumber(fuelCount), "รายการ"],
      ["ต้องตรวจ", formatNumber(alertCount), "รายการ"]
    ];
    target.innerHTML = cards.map(([label, value, unit]) => `
      <div class="summary-card">
        <span>${escapeHtml(label)}</span>
        <strong>${escapeHtml(value)}</strong>
        <small>${escapeHtml(unit)}</small>
      </div>
    `).join("");
  }

  function renderSystemHealth() {
    const target = document.getElementById("systemHealthPanel");
    if (!target) return;
    const health = dashboard.systemHealth || {};
    const syncStatus = health.failedSyncs ? "มีรายการล้มเหลว" : "ปกติ";
    const backupLink = health.lastBackupUrl
      ? `<a href="${escapeAttr(health.lastBackupUrl)}" target="_blank" rel="noopener">เปิดไฟล์สำรอง</a>`
      : "-";
    const cards = [
      ["ข้อมูลการใช้รถ", formatNumber(health.usageRows), "รายการจาก Usage Segments"],
      ["บิลน้ำมัน", formatNumber(health.fuelRows), "รายการจาก Fuel Bills"],
      ["สรุปรายวัน/เดือน", `${formatNumber(health.dailySummaryRows)} / ${formatNumber(health.monthlySummaryRows)}`, "แถวสรุปที่พร้อมใช้งาน"],
      ["ซิงก์ล่าสุด", health.latestSyncAt || "-", `${syncStatus} (${formatNumber(health.failedSyncs)} failed)`],
      ["สำรองล่าสุด", health.lastBackupAt || "-", backupLink]
    ];
    target.innerHTML = cards.map(([label, value, detail]) => `
      <div class="summary-card health-card">
        <span>${escapeHtml(label)}</span>
        <strong>${escapeHtml(value)}</strong>
        <small>${detail && String(detail).indexOf("<a ") === 0 ? detail : escapeHtml(detail || "-")}</small>
      </div>
    `).join("");
  }

  function createBackupNow() {
    if (!confirm("ยืนยันสำรองไฟล์ Google Sheets ตอนนี้")) return;
    updateWorkflowStatus("กำลังสำรองไฟล์ Google Sheets...");
    setLoading(true);
    google.script.run
      .withSuccessHandler((result) => {
        setLoading(false);
        if (!result || result.ok === false) {
          toast(result?.error || "สำรองไฟล์ไม่สำเร็จ", true);
          updateWorkflowStatus("สำรองไฟล์ไม่สำเร็จ");
          return;
        }
        toast("สำรองไฟล์สำเร็จ");
        updateWorkflowStatus("สำรองไฟล์สำเร็จ กำลังโหลดสถานะล่าสุด...");
        refreshDashboard();
      })
      .withFailureHandler(saveFailed)
      .createDailyBackup();
  }

  function exportCsv(type) {
    const report = buildCsvReport(type);
    if (!report.rows.length) {
      toast("ไม่มีข้อมูลสำหรับส่งออก", true);
      return;
    }
    const csv = [report.headers, ...report.rows].map((row) => row.map(csvValue).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${report.fileName}_${reportDateRangeSlug()}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    toast(`ส่งออก ${report.title} แล้ว`);
  }

  function exportSelectedCsv() {
    exportCsv(document.getElementById("csvExportType")?.value || "usage");
  }

        rows: (dashboard.fuelRows || []).map((row) => [

          row.plate || row.assetCode,
          row.driverName || row.driverId,
          row.odometer,
          row.fuelType,
          row.liters,
          row.amount,
          row.pricePerLiter,
          row.station,

          row.note
        ])

      daily: {
        title: "สรุปรายวัน",
        fileName: "daily-summary",
        headers: ["วันที่", "ทะเบียน", "ผู้ขับ", "ระยะทาง", "ค่าน้ำมัน", "สถานะ"],

  function copyLineSummary() {
    const kpi = dashboard.kpis?.range || dashboard.kpis?.month || {};
    const today = dashboard.kpis?.today || {};

  function printReport() {
    const html = buildPrintReportHtml();
    const win = window.open("", "_blank");
    if (!win) {

    }
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);

        <head>
          <meta charset="UTF-8">

            body { font-family: Arial, "Noto Sans Thai", sans-serif; color: #17231a; margin: 24px; }
            h1 { margin: 0 0 4px; font-size: 24px; }

        </head>

          <h1>รายงานการใช้รถและค่าน้ำมัน</h1>
          <div class="muted">ช่วงวันที่: ${escapeHtml(reportDateRangeText())}</div>
          <div class="kpis">
            ${printKpi("ระยะทางรวม", formatNumber(kpi.distance), "กม.")}
            ${printKpi("ค่าน้ำมันรวม", formatNumber(kpi.fuelAmount), "บาท")}
            ${printKpi("น้ำมันรวม", formatNumber(kpi.fuelLiters), "ลิตร")}
            ${printKpi("บาท/กม.", formatNumber(kpi.bahtPerKm), "")}
            ${printKpi("รายการต้องตรวจ", formatNumber(alerts.length), "รายการ")}
          </div>
          <h2>สรุปรายวัน</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "ระยะทาง", "ค่าน้ำมัน", "สถานะ"], (dashboard.dailySummary || []).map((row) => [row.serviceDate, row.plate, row.driverName, formatNumber(row.distance), formatNumber(row.fuelAmount), row.status]))}
          <h2>สรุปรายเดือน</h2>
          ${printTable(["เดือน", "ทะเบียน", "ผู้ขับ", "วันใช้งาน", "ระยะทาง", "ค่าน้ำมัน"], (dashboard.monthlySummary || []).map((row) => [row.month, row.plate, row.driverName, formatNumber(row.workingDays), formatNumber(row.distance), formatNumber(row.fuelAmount)]))}
          <h2 class="page-break">รายละเอียดการใช้รถ</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "ประเภท", "เลขไมค์ก่อนหน้า", "เลขไมค์ปัจจุบัน", "ระยะทาง", "การใช้งาน"], (dashboard.usageRows || []).map((row) => [row.serviceDate, row.plate || row.assetCode, row.driverName || row.driverId, eventLabel(row.eventType), formatNumber(row.odometerStart), formatNumber(row.odometer), formatNumber(usageDistance(row)), row.usageType || row.detail || row.note]))}
          <h2>บิลน้ำมัน</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "เลขไมค์ตอนเติม", "ลิตร", "ยอดเงิน", "ปั๊ม", "เลขที่บิล"], (dashboard.fuelRows || []).map((row) => [row.serviceDate, row.plate || row.assetCode, row.driverName || row.driverId, formatNumber(row.odometer), formatNumber(row.liters), formatNumber(row.amount), row.station, row.receiptNo]))}

  function printKpi(label, value, unit) {
    return `<div class="kpi"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong><span>${escapeHtml(unit)}</span></div>`;
  }

  function printTable(headers, rows) {
    const body = rows.length ? rows.map((row) => `<tr>${row.map((value) => `<td>${escapeHtml(value ?? "")}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}" class="muted">ไม่มีข้อมูล</td></tr>`;
    return `<table><thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
      } catch (error) {
        reject(error);
      } finally {
        document.body.removeChild(textarea);
      }
    });
  }

  function csvValue(value) {
    return `"${String(value ?? "").replace(/"/g, '""')}"`;
  }

  function usageDistance(row) {
    if (row.odometerStart === "" || row.odometerStart == null || row.odometer === "" || row.odometer == null) return "";
    const start = Number(row.odometerStart);
    const end = Number(row.odometer);
    return Number.isFinite(start) && Number.isFinite(end) && end >= start ? end - start : "";
  }

  function reportDateRangeText() {
    const filters = dashboard.filters || getDateFilters();
    return `${filters.dateFrom || "-"} ถึง ${filters.dateTo || "-"}`;
  }

  function reportDateRangeSlug() {
    const filters = dashboard.filters || getDateFilters();
    return `${filters.dateFrom || "all"}_${filters.dateTo || "today"}`.replace(/[^\dA-Za-z_-]/g, "-");
  }

  function fillFormOptions() {
    const vehicleOptions = `<option value="">เลือกรถ</option>` + (dashboard.vehicles || []).map((v) => {
      const value = escapeAttr(v.assetCode || v.plate);
      const label = [v.plate, v.brand, v.model, v.responsiblePerson].filter(Boolean).join(" · ");
      return `<option value="${value}">${escapeHtml(label)}</option>`;
    }).join("");
    const driverOptions = `<option value="">เลือก/พิมพ์ชื่อในหมายเหตุได้</option>` + (dashboard.drivers || []).map((d) => {
      const value = escapeAttr(d.driverId || d.driverName);
      const label = [d.driverName, d.driverPhone].filter(Boolean).join(" · ");
      return `<option value="${value}">${escapeHtml(label || value)}</option>`;
    }).join("");
    document.querySelectorAll('select[name="vehicleKey"]').forEach((el) => el.innerHTML = vehicleOptions);
    document.querySelectorAll('select[name="driverKey"]').forEach((el) => el.innerHTML = driverOptions);
  }

  function submitUsage(event) {
    event.preventDefault();
    const form = event.target;
    const vehicle = findVehicle(form.vehicleKey.value);
    const driver = findDriver(form.driverKey.value);
    const payload = {
      id: form.id.value,
      serviceDate: form.serviceDate.value,
      eventType: form.eventType.value,
      driverId: driver.driverId || form.driverKey.value,
      driverName: driver.driverName || form.driverKey.value,
      driverPhone: driver.driverPhone || "",
      vehicleId: vehicle.assetCode || form.vehicleKey.value,
      assetCode: vehicle.assetCode || form.vehicleKey.value,
      plate: vehicle.plate || "",
      vehicleName: [vehicle.plate, vehicle.brand, vehicle.model].filter(Boolean).join(" · "),
      odometer: form.odometer.value,
      odometerStart: form.odometerStart.value,
      usageType: form.usageType.value,
      detail: form.detail.value,
      note: form.note.value
    };
    payload.editorName = document.getElementById("editorName").value;
    if (!confirm("ยืนยันบันทึกการใช้รถ")) return;
    updateWorkflowStatus("กำลังบันทึกการใช้รถ...");
    setLoading(true);
    google.script.run.withSuccessHandler(afterSave).withFailureHandler(saveFailed).saveDashboardUsageSegment(payload);
  }

  function submitFuel(event) {
    event.preventDefault();
    const form = event.target;
    const vehicle = findVehicle(form.vehicleKey.value);
    const driver = findDriver(form.driverKey.value);
    const liters = Number(form.liters.value || 0);
    const amount = Number(form.amount.value || 0);
    const payload = {
      id: form.id.value,
      serviceDate: form.serviceDate.value,
      driverId: driver.driverId || form.driverKey.value,
      driverName: driver.driverName || form.driverKey.value,
      driverPhone: driver.driverPhone || "",
      vehicleId: vehicle.assetCode || form.vehicleKey.value,
      assetCode: vehicle.assetCode || form.vehicleKey.value,
      plate: vehicle.plate || "",
      vehicleType: vehicle.vehicleType || "",
      brand: vehicle.brand || "",
      model: vehicle.model || "",
      vehicleName: [vehicle.plate, vehicle.brand, vehicle.model].filter(Boolean).join(" · "),
      responsiblePerson: vehicle.responsiblePerson || "",
      department: vehicle.department || "",
      odometer: form.odometer.value,
      fuelType: form.fuelType.value,
      liters: form.liters.value,
      amount: form.amount.value,
      pricePerLiter: liters ? amount / liters : "",
      station: form.station.value,
      receiptNo: form.receiptNo.value,
      note: form.note.value
    };
    payload.editorName = document.getElementById("editorName").value;
    if (!confirm("ยืนยันบันทึกบิลน้ำมัน")) return;
    updateWorkflowStatus("กำลังบันทึกบิลน้ำมัน...");
    setLoading(true);
    google.script.run.withSuccessHandler(afterSave).withFailureHandler(saveFailed).saveDashboardFuelBill(payload);
  }

  function afterSave(result) {
    setLoading(false);
    if (!result || result.ok === false) {
      toast(result?.error || "บันทึกไม่สำเร็จ", true);
      updateWorkflowStatus("บันทึกไม่สำเร็จ");
      return;
    }
    toast("บันทึกสำเร็จ กำลังโหลดข้อมูลล่าสุด");
    updateWorkflowStatus("บันทึกสำเร็จ กำลังโหลดข้อมูลล่าสุด...");
    resetUsageForm();
    resetFuelForm();
    refreshDashboard();
  }

  function saveFailed(error) {
    setLoading(false);
    toast(error?.message || String(error), true);
    updateWorkflowStatus("ทำรายการไม่สำเร็จ");
  }

  function refreshSummaries() {
    if (!confirm("ยืนยันคำนวณสรุปใหม่จาก Sheet")) return;
    updateWorkflowStatus("กำลังคำนวณสรุปใหม่จาก Sheet...");
    setLoading(true);
    google.script.run
      .withSuccessHandler((result) => {
        setLoading(false);
        if (!result || result.ok === false) {
          toast(result?.error || "คำนวณสรุปใหม่จาก Sheet ไม่สำเร็จ", true);
          updateWorkflowStatus("คำนวณสรุปใหม่ไม่สำเร็จ");
          return;
        }
        toast("คำนวณสรุปใหม่จาก Sheet สำเร็จ กำลังโหลดข้อมูลล่าสุด");
        updateWorkflowStatus("คำนวณสรุปใหม่สำเร็จ กำลังโหลดข้อมูลล่าสุด...");
        refreshDashboard();
      })
      .withFailureHandler(saveFailed)
      .refreshWebSummaries();
  }

  function initDateRange() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    document.getElementById("dateFrom").value = `${yyyy}-${mm}-01`;
    document.getElementById("dateTo").value = `${yyyy}-${mm}-${dd}`;
  }

  function getDateFilters() {
    return {
      dateFrom: document.getElementById("dateFrom").value,
      dateTo: document.getElementById("dateTo").value
    };
  }

  function setQuickRange(type) {
    const today = new Date();
    const end = formatDateInput(today);
    let start = end;
    if (type === "month") {
      start = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-01`;
    } else if (type === "30days") {
      const from = new Date(today);
      from.setDate(from.getDate() - 29);
      start = formatDateInput(from);
    }
    document.getElementById("dateFrom").value = start;
    document.getElementById("dateTo").value = end;
    refreshDashboard();
  }

  function formatDateInput(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  }

  function editUsage(id) {
    const row = (dashboard.usageRows || []).find((item) => item.id === id);
    if (!row) return;
    switchTab("add");
    const form = document.getElementById("usageForm");
    form.id.value = row.id || "";
    form.serviceDate.value = row.serviceDate || "";
    form.vehicleKey.value = row.assetCode || row.vehicleId || row.plate || "";
    form.driverKey.value = row.driverId || row.driverName || "";
    form.eventType.value = row.eventType || "segment";
    form.odometer.value = row.odometer || "";
    form.odometerStart.value = row.odometerStart || "";
    form.usageType.value = row.usageType || "";
    form.detail.value = row.detail || "";
    form.note.value = row.note || "";
  }

  function editFuel(id) {
    const row = (dashboard.fuelRows || []).find((item) => item.id === id);
    if (!row) return;
    switchTab("add");
    const form = document.getElementById("fuelForm");
    form.id.value = row.id || "";
    form.serviceDate.value = row.serviceDate || "";
    form.vehicleKey.value = row.assetCode || row.vehicleId || row.plate || "";
    form.driverKey.value = row.driverId || row.driverName || "";
    form.odometer.value = row.odometer || "";
    form.fuelType.value = row.fuelType || "";
    form.liters.value = row.liters || "";
    form.amount.value = row.amount || "";
    form.station.value = row.station || "";
    form.receiptNo.value = row.receiptNo || "";
    form.note.value = row.note || "";
  }

  function openUsageForm() {
    switchTab("add");
    document.getElementById("usageForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function openFuelForm() {
    switchTab("add");
    document.getElementById("fuelForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetUsageForm() {
    document.getElementById("usageForm").reset();
    document.querySelector('#usageForm input[name="id"]').value = "";
  }

  function resetFuelForm() {
    document.getElementById("fuelForm").reset();
    document.querySelector('#fuelForm input[name="id"]').value = "";
  }

  function switchTab(tabId) {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabId));
    document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("active", panel.id === tabId));
  }

  function findVehicle(key) {
    return (dashboard.vehicles || []).find((v) => v.assetCode === key || v.plate === key) || {};
  }

  function findDriver(key) {
    return (dashboard.drivers || []).find((d) => d.driverId === key || d.driverName === key) || {};
  }

  function eventLabel(value) {
    return { start: "เริ่มใช้", segment: "ระหว่างวัน", end: "จบงาน", probe: "ทดสอบ" }[value] || value || "-";
  }

  function emptyRow(colspan) {
    return `<tr><td colspan="${colspan}" class="muted">ยังไม่มีข้อมูล</td></tr>`;
  }

  function formatNumber(value) {
    const n = Number(value || 0);
    if (!Number.isFinite(n)) return value || "-";
    return n.toLocaleString("th-TH", { maximumFractionDigits: 2 });
  }

  function lower(value) {
    return String(value || "").toLowerCase();
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, "&#096;");
  }

  function toast(message, isError) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.toggle("error", Boolean(isError));
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3600);
  }

  function setLoading(show) {
    document.getElementById("loading").classList.toggle("show", Boolean(show));
  }
</script>
