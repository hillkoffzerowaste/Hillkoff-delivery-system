<script>
  let dashboard = {
    vehicles: [],
    drivers: [],
    usageRows: [],
    fuelRows: [],
    dailySummary: [],
    monthlySummary: [],
    rankings: {},
    alerts: [],
    kpis: { today: {}, month: {} }
  };

  document.addEventListener("DOMContentLoaded", () => {
    initDateRange();
    refreshDashboard();
  });

  function refreshDashboard() {
    setLoading(true);
    google.script.run
      .withSuccessHandler((data) => {
        setLoading(false);
        if (!data || data.ok === false) {
          toast(data?.error || "โหลดข้อมูลไม่สำเร็จ", true);
          return;
        }
        dashboard = data;
        renderAll();
      })
      .withFailureHandler((error) => {
        setLoading(false);
        toast(error?.message || String(error), true);
      })
      .getWebDashboardData(getDateFilters());
  }

  function renderAll() {
    document.getElementById("updatedAt").textContent = `อัปเดตล่าสุด: ${dashboard.updatedAt || "-"}`;
    document.getElementById("todayLabel").textContent = dashboard.today || "";
    document.getElementById("monthLabel").textContent = `${dashboard.filters?.dateFrom || ""} ถึง ${dashboard.filters?.dateTo || ""}`;
    document.getElementById("sheetLink").href = dashboard.sheetUrl || "#";
    renderKpis("todayKpis", dashboard.kpis.today || {}, [
      ["vehicles", "รถใช้งาน", "คัน"],
      ["drivers", "คนขับ", "คน"],
      ["distance", "ระยะทาง", "กม."],
      ["fuelAmount", "ค่าน้ำมัน", "บาท"],
      ["openItems", "ยังไม่จบงาน", "รายการ"]
    ]);
    renderKpis("monthKpis", dashboard.kpis.range || dashboard.kpis.month || {}, [
      ["distance", "ระยะทางรวม", "กม."],
      ["fuelAmount", "ค่าน้ำมันรวม", "บาท"],
      ["fuelLiters", "น้ำมันรวม", "ลิตร"],
      ["bahtPerKm", "บาท/กม.", ""],
      ["kmPerLiter", "กม./ลิตร", ""]
    ]);
    fillFormOptions();
    renderAlerts();
    renderAlertsTable();
    renderRankings();
    renderUsageTable();
    renderFuelTable();
    renderReports();
  }

  function renderKpis(targetId, source, items) {
    document.getElementById(targetId).innerHTML = items.map(([key, label, unit]) => `
      <div class="kpi">
        <span>${escapeHtml(label)}</span>
        <strong>${formatNumber(source[key])}</strong>
        <small>${escapeHtml(unit)}</small>
      </div>
    `).join("");
  }

  function renderAlerts() {
    const alerts = dashboard.alerts || [];
    document.getElementById("alertCount").textContent = alerts.length;
    document.getElementById("alertsList").innerHTML = alerts.length ? alerts.slice(0, 12).map((item) => `
      <div class="list-item ${escapeHtml(item.type || "info")}">
        <b>${escapeHtml(item.title || "-")}</b>
        <small>${escapeHtml(item.detail || "")}</small>
      </div>
    `).join("") : `<div class="list-item"><b>ไม่มีรายการแจ้งเตือน</b><small>ข้อมูลล่าสุดปกติ</small></div>`;
  }

  function renderAlertsTable() {
    const alerts = dashboard.alerts || [];
    document.getElementById("alertsTable").innerHTML = alerts.length ? alerts.map((item) => `
      <div class="list-item ${escapeHtml(item.type || "info")}">
        <b>${escapeHtml(item.title || "-")}</b>
        <small>${escapeHtml(item.detail || "")}</small>
      </div>
    `).join("") : `<div class="list-item"><b>ไม่มีรายการที่ต้องตรวจ</b><small>ช่วงวันที่นี้ไม่พบความผิดปกติ</small></div>`;
  }

  function renderRankings() {
    const groups = [
      ["รถระยะทางสูงสุด", dashboard.rankings?.vehicleDistance || [], "กม."],
      ["คนขับระยะทางสูงสุด", dashboard.rankings?.driverDistance || [], "กม."],
      ["รถค่าน้ำมันสูงสุด", dashboard.rankings?.vehicleFuelAmount || [], "บาท"]
    ];
    document.getElementById("rankingList").innerHTML = groups.map(([title, rows, unit]) => `
      <div class="list-item">
        <b>${escapeHtml(title)}</b>
        <small>${rows.length ? rows.map((r) => `${escapeHtml(r.label)}: ${formatNumber(r.value)} ${unit}`).join(" | ") : "ยังไม่มีข้อมูล"}</small>
      </div>
    `).join("");
  }

  function renderUsageTable() {
    const q = lower(document.getElementById("usageSearch")?.value);
    const status = document.getElementById("usageStatus")?.value || "";
    const rows = (dashboard.usageRows || []).filter((row) => {
      if (status && row.eventType !== status) return false;
      return !q || lower(Object.values(row).join(" ")).includes(q);
    }).slice(0, 300);
    document.getElementById("usageTable").innerHTML = rows.map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate || row.assetCode)}</td>
        <td>${escapeHtml(row.driverName || row.driverId)}</td>
        <td>${escapeHtml(eventLabel(row.eventType))}</td>
        <td>${formatNumber(row.odometer)}</td>
        <td>${formatNumber(row.odometerStart)}</td>
        <td>${escapeHtml(row.usageType || row.detail || row.note)}</td>
        <td><div class="row-actions"><button class="secondary mini" type="button" onclick="editUsage('${escapeAttr(row.id)}')">แก้ไข</button></div></td>
      </tr>
    `).join("") || emptyRow(8);
  }

  function renderFuelTable() {
    const q = lower(document.getElementById("fuelSearch")?.value);
    const rows = (dashboard.fuelRows || []).filter((row) => !q || lower(Object.values(row).join(" ")).includes(q)).slice(0, 300);
    document.getElementById("fuelTable").innerHTML = rows.map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate || row.assetCode)}</td>
        <td>${escapeHtml(row.driverName || row.driverId)}</td>
        <td>${formatNumber(row.odometer)}</td>
        <td>${formatNumber(row.liters)}</td>
        <td>${formatNumber(row.amount)}</td>
        <td>${escapeHtml(row.station)}</td>
        <td>${escapeHtml(row.receiptNo)}</td>
        <td><div class="row-actions"><button class="secondary mini" type="button" onclick="editFuel('${escapeAttr(row.id)}')">แก้ไข</button></div></td>
      </tr>
    `).join("") || emptyRow(9);
  }

  function renderReports() {
    document.getElementById("dailyReport").innerHTML = (dashboard.dailySummary || []).slice(0, 150).map((row) => `
      <tr>
        <td>${escapeHtml(row.serviceDate)}</td>
        <td>${escapeHtml(row.plate)}</td>
        <td>${escapeHtml(row.driverName)}</td>
        <td>${formatNumber(row.distance)}</td>
        <td>${formatNumber(row.fuelAmount)}</td>
        <td>${escapeHtml(row.status)}</td>
      </tr>
    `).join("") || emptyRow(6);
    document.getElementById("monthlyReport").innerHTML = (dashboard.monthlySummary || []).slice(0, 150).map((row) => `
      <tr>
        <td>${escapeHtml(row.month)}</td>
        <td>${escapeHtml(row.plate)}</td>
        <td>${escapeHtml(row.driverName)}</td>
        <td>${formatNumber(row.workingDays)}</td>
        <td>${formatNumber(row.distance)}</td>
        <td>${formatNumber(row.fuelAmount)}</td>
      </tr>
    `).join("") || emptyRow(6);
  }

  function exportCsv(type) {
    const report = buildCsvReport(type);
    if (!report.rows.length) {
      toast("ไม่มีข้อมูลสำหรับส่งออก", true);
      return;
    }
    const csv = [report.headers, ...report.rows].map((row) => row.map(csvValue).join(",")).join("\r\n");
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `${report.fileName}_${reportDateRangeSlug()}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
    toast(`ส่งออก ${report.title} แล้ว`);
  }

  function buildCsvReport(type) {
    const reports = {
      usage: {
        title: "การใช้รถ",
        fileName: "vehicle-usage",
        headers: ["วันที่", "ทะเบียน", "ผู้ขับ", "ประเภทบันทึก", "เลขไมค์ก่อนหน้า", "เลขไมค์ปัจจุบัน", "ระยะทาง", "การใช้งาน", "รายละเอียด", "หมายเหตุ"],
        rows: (dashboard.usageRows || []).map((row) => [
          row.serviceDate,
          row.plate || row.assetCode,
          row.driverName || row.driverId,
          eventLabel(row.eventType),
          row.odometerStart,
          row.odometer,
          usageDistance(row),
          row.usageType,
          row.detail,
          row.note
        ])
      },
      fuel: {
        title: "บิลน้ำมัน",
        fileName: "fuel-bills",
        headers: ["วันที่", "ทะเบียน", "ผู้ขับ", "เลขไมค์ตอนเติมน้ำมัน", "ประเภทน้ำมัน", "ลิตร", "ยอดเงิน", "บาทต่อลิตร", "ปั๊ม", "เลขที่บิล", "หมายเหตุ"],
        rows: (dashboard.fuelRows || []).map((row) => [
          row.serviceDate,
          row.plate || row.assetCode,
          row.driverName || row.driverId,
          row.odometer,
          row.fuelType,
          row.liters,
          row.amount,
          row.pricePerLiter,
          row.station,
          row.receiptNo,
          row.note
        ])
      },
      daily: {
        title: "สรุปรายวัน",
        fileName: "daily-summary",
        headers: ["วันที่", "ทะเบียน", "ผู้ขับ", "ระยะทาง", "ค่าน้ำมัน", "สถานะ"],
        rows: (dashboard.dailySummary || []).map((row) => [
          row.serviceDate,
          row.plate,
          row.driverName,
          row.distance,
          row.fuelAmount,
          row.status
        ])
      },
      monthly: {
        title: "สรุปรายเดือน",
        fileName: "monthly-summary",
        headers: ["เดือน", "ทะเบียน", "ผู้ขับ", "วันใช้งาน", "ระยะทาง", "ค่าน้ำมัน"],
        rows: (dashboard.monthlySummary || []).map((row) => [
          row.month,
          row.plate,
          row.driverName,
          row.workingDays,
          row.distance,
          row.fuelAmount
        ])
      }
    };
    return reports[type] || { title: "", fileName: "report", headers: [], rows: [] };
  }

  function copyLineSummary() {
    const kpi = dashboard.kpis?.range || dashboard.kpis?.month || {};
    const today = dashboard.kpis?.today || {};
    const alertCount = (dashboard.alerts || []).length;
    const text = [
      `รายงานการใช้รถ ${reportDateRangeText()}`,
      `รถใช้งานวันนี้: ${formatNumber(today.vehicles)} คัน`,
      `ผู้ขับวันนี้: ${formatNumber(today.drivers)} คน`,
      `ระยะทางรวม: ${formatNumber(kpi.distance)} กม.`,
      `ค่าน้ำมันรวม: ${formatNumber(kpi.fuelAmount)} บาท`,
      `น้ำมันรวม: ${formatNumber(kpi.fuelLiters)} ลิตร`,
      `บาท/กม.: ${formatNumber(kpi.bahtPerKm)}`,
      `กม./ลิตร: ${formatNumber(kpi.kmPerLiter)}`,
      `รายการต้องตรวจ: ${formatNumber(alertCount)} รายการ`
    ].join("\n");

    copyText(text)
      .then(() => toast("คัดลอกสรุป LINE แล้ว"))
      .catch(() => toast("คัดลอกไม่สำเร็จ", true));
  }

  function printReport() {
    const html = buildPrintReportHtml();
    const win = window.open("", "_blank");
    if (!win) {
      toast("เบราว์เซอร์บล็อกหน้าพิมพ์ กรุณาอนุญาต popup", true);
      return;
    }
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(() => win.print(), 300);
  }

  function buildPrintReportHtml() {
    const kpi = dashboard.kpis?.range || dashboard.kpis?.month || {};
    const alerts = dashboard.alerts || [];
    return `<!DOCTYPE html>
      <html>
        <head>
          <meta charset="UTF-8">
          <title>รายงานการใช้รถ</title>
          <style>
            body { font-family: Arial, "Noto Sans Thai", sans-serif; color: #17231a; margin: 24px; }
            h1 { margin: 0 0 4px; font-size: 24px; }
            h2 { margin: 22px 0 10px; font-size: 17px; }
            .muted { color: #66736b; }
            .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px 0; }
            .kpi { border: 1px solid #dbe3dc; border-radius: 8px; padding: 10px; }
            .kpi span { display: block; color: #66736b; font-size: 12px; }
            .kpi strong { display: block; margin-top: 4px; font-size: 20px; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
            th, td { border: 1px solid #dbe3dc; padding: 7px 8px; text-align: left; vertical-align: top; font-size: 12px; }
            th { background: #edf3ee; }
            @media print { body { margin: 12mm; } .page-break { page-break-before: always; } }
          </style>
        </head>
        <body>
          <h1>รายงานการใช้รถและค่าน้ำมัน</h1>
          <div class="muted">ช่วงวันที่: ${escapeHtml(reportDateRangeText())}</div>
          <div class="kpis">
            ${printKpi("ระยะทางรวม", formatNumber(kpi.distance), "กม.")}
            ${printKpi("ค่าน้ำมันรวม", formatNumber(kpi.fuelAmount), "บาท")}
            ${printKpi("น้ำมันรวม", formatNumber(kpi.fuelLiters), "ลิตร")}
            ${printKpi("บาท/กม.", formatNumber(kpi.bahtPerKm), "")}
            ${printKpi("รายการต้องตรวจ", formatNumber(alerts.length), "รายการ")}
          </div>
          <h2>สรุปรายวัน</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "ระยะทาง", "ค่าน้ำมัน", "สถานะ"], (dashboard.dailySummary || []).map((row) => [row.serviceDate, row.plate, row.driverName, formatNumber(row.distance), formatNumber(row.fuelAmount), row.status]))}
          <h2>สรุปรายเดือน</h2>
          ${printTable(["เดือน", "ทะเบียน", "ผู้ขับ", "วันใช้งาน", "ระยะทาง", "ค่าน้ำมัน"], (dashboard.monthlySummary || []).map((row) => [row.month, row.plate, row.driverName, formatNumber(row.workingDays), formatNumber(row.distance), formatNumber(row.fuelAmount)]))}
          <h2 class="page-break">รายละเอียดการใช้รถ</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "ประเภท", "เลขไมค์ก่อนหน้า", "เลขไมค์ปัจจุบัน", "ระยะทาง", "การใช้งาน"], (dashboard.usageRows || []).map((row) => [row.serviceDate, row.plate || row.assetCode, row.driverName || row.driverId, eventLabel(row.eventType), formatNumber(row.odometerStart), formatNumber(row.odometer), formatNumber(usageDistance(row)), row.usageType || row.detail || row.note]))}
          <h2>บิลน้ำมัน</h2>
          ${printTable(["วันที่", "ทะเบียน", "ผู้ขับ", "เลขไมค์ตอนเติม", "ลิตร", "ยอดเงิน", "ปั๊ม", "เลขที่บิล"], (dashboard.fuelRows || []).map((row) => [row.serviceDate, row.plate || row.assetCode, row.driverName || row.driverId, formatNumber(row.odometer), formatNumber(row.liters), formatNumber(row.amount), row.station, row.receiptNo]))}
          <h2>รายการต้องตรวจ</h2>
          ${printTable(["ประเภท", "รายละเอียด"], alerts.map((row) => [row.title, row.detail]))}
        </body>
      </html>`;
  }

  function printKpi(label, value, unit) {
    return `<div class="kpi"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong><span>${escapeHtml(unit)}</span></div>`;
  }

  function printTable(headers, rows) {
    const body = rows.length ? rows.map((row) => `<tr>${row.map((value) => `<td>${escapeHtml(value ?? "")}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${headers.length}" class="muted">ไม่มีข้อมูล</td></tr>`;
    return `<table><thead><tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.left = "-9999px";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand("copy") ? resolve() : reject(new Error("copy failed"));
      } catch (error) {
        reject(error);
      } finally {
        document.body.removeChild(textarea);
      }
    });
  }

  function csvValue(value) {
    return `"${String(value ?? "").replace(/"/g, '""')}"`;
  }

  function usageDistance(row) {
    if (row.odometerStart === "" || row.odometerStart == null || row.odometer === "" || row.odometer == null) return "";
    const start = Number(row.odometerStart);
    const end = Number(row.odometer);
    return Number.isFinite(start) && Number.isFinite(end) && end >= start ? end - start : "";
  }

  function reportDateRangeText() {
    const filters = dashboard.filters || getDateFilters();
    return `${filters.dateFrom || "-"} ถึง ${filters.dateTo || "-"}`;
  }

  function reportDateRangeSlug() {
    const filters = dashboard.filters || getDateFilters();
    return `${filters.dateFrom || "all"}_${filters.dateTo || "today"}`.replace(/[^\dA-Za-z_-]/g, "-");
  }

  function fillFormOptions() {
    const vehicleOptions = `<option value="">เลือกรถ</option>` + (dashboard.vehicles || []).map((v) => {
      const value = escapeAttr(v.assetCode || v.plate);
      const label = [v.plate, v.brand, v.model, v.responsiblePerson].filter(Boolean).join(" · ");
      return `<option value="${value}">${escapeHtml(label)}</option>`;
    }).join("");
    const driverOptions = `<option value="">เลือก/พิมพ์ชื่อในหมายเหตุได้</option>` + (dashboard.drivers || []).map((d) => {
      const value = escapeAttr(d.driverId || d.driverName);
      const label = [d.driverName, d.driverPhone].filter(Boolean).join(" · ");
      return `<option value="${value}">${escapeHtml(label || value)}</option>`;
    }).join("");
    document.querySelectorAll('select[name="vehicleKey"]').forEach((el) => el.innerHTML = vehicleOptions);
    document.querySelectorAll('select[name="driverKey"]').forEach((el) => el.innerHTML = driverOptions);
  }

  function submitUsage(event) {
    event.preventDefault();
    const form = event.target;
    const vehicle = findVehicle(form.vehicleKey.value);
    const driver = findDriver(form.driverKey.value);
    const payload = {
      id: form.id.value,
      serviceDate: form.serviceDate.value,
      eventType: form.eventType.value,
      driverId: driver.driverId || form.driverKey.value,
      driverName: driver.driverName || form.driverKey.value,
      driverPhone: driver.driverPhone || "",
      vehicleId: vehicle.assetCode || form.vehicleKey.value,
      assetCode: vehicle.assetCode || form.vehicleKey.value,
      plate: vehicle.plate || "",
      vehicleName: [vehicle.plate, vehicle.brand, vehicle.model].filter(Boolean).join(" · "),
      odometer: form.odometer.value,
      odometerStart: form.odometerStart.value,
      usageType: form.usageType.value,
      detail: form.detail.value,
      note: form.note.value
    };
    payload.editorName = document.getElementById("editorName").value;
    if (!confirm("ยืนยันบันทึกการใช้รถ")) return;
    setLoading(true);
    google.script.run.withSuccessHandler(afterSave).withFailureHandler(saveFailed).saveDashboardUsageSegment(payload);
  }

  function submitFuel(event) {
    event.preventDefault();
    const form = event.target;
    const vehicle = findVehicle(form.vehicleKey.value);
    const driver = findDriver(form.driverKey.value);
    const liters = Number(form.liters.value || 0);
    const amount = Number(form.amount.value || 0);
    const payload = {
      id: form.id.value,
      serviceDate: form.serviceDate.value,
      driverId: driver.driverId || form.driverKey.value,
      driverName: driver.driverName || form.driverKey.value,
      driverPhone: driver.driverPhone || "",
      vehicleId: vehicle.assetCode || form.vehicleKey.value,
      assetCode: vehicle.assetCode || form.vehicleKey.value,
      plate: vehicle.plate || "",
      vehicleType: vehicle.vehicleType || "",
      brand: vehicle.brand || "",
      model: vehicle.model || "",
      vehicleName: [vehicle.plate, vehicle.brand, vehicle.model].filter(Boolean).join(" · "),
      responsiblePerson: vehicle.responsiblePerson || "",
      department: vehicle.department || "",
      odometer: form.odometer.value,
      fuelType: form.fuelType.value,
      liters: form.liters.value,
      amount: form.amount.value,
      pricePerLiter: liters ? amount / liters : "",
      station: form.station.value,
      receiptNo: form.receiptNo.value,
      note: form.note.value
    };
    payload.editorName = document.getElementById("editorName").value;
    if (!confirm("ยืนยันบันทึกบิลน้ำมัน")) return;
    setLoading(true);
    google.script.run.withSuccessHandler(afterSave).withFailureHandler(saveFailed).saveDashboardFuelBill(payload);
  }

  function afterSave(result) {
    setLoading(false);
    if (!result || result.ok === false) {
      toast(result?.error || "บันทึกไม่สำเร็จ", true);
      return;
    }
    toast("บันทึกสำเร็จ");
    resetUsageForm();
    resetFuelForm();
    refreshDashboard();
  }

  function saveFailed(error) {
    setLoading(false);
    toast(error?.message || String(error), true);
  }

  function refreshSummaries() {
    if (!confirm("ยืนยันคำนวณสรุปใหม่จาก Sheet")) return;
    setLoading(true);
    google.script.run
      .withSuccessHandler((result) => {
        setLoading(false);
        if (!result || result.ok === false) {
          toast(result?.error || "คำนวณสรุปใหม่จาก Sheet ไม่สำเร็จ", true);
          return;
        }
        toast("คำนวณสรุปใหม่จาก Sheet สำเร็จ");
        refreshDashboard();
      })
      .withFailureHandler(saveFailed)
      .refreshWebSummaries();
  }

  function initDateRange() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, "0");
    const dd = String(today.getDate()).padStart(2, "0");
    document.getElementById("dateFrom").value = `${yyyy}-${mm}-01`;
    document.getElementById("dateTo").value = `${yyyy}-${mm}-${dd}`;
  }

  function getDateFilters() {
    return {
      dateFrom: document.getElementById("dateFrom").value,
      dateTo: document.getElementById("dateTo").value
    };
  }

  function setQuickRange(type) {
    const today = new Date();
    const end = formatDateInput(today);
    let start = end;
    if (type === "month") {
      start = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-01`;
    } else if (type === "30days") {
      const from = new Date(today);
      from.setDate(from.getDate() - 29);
      start = formatDateInput(from);
    }
    document.getElementById("dateFrom").value = start;
    document.getElementById("dateTo").value = end;
    refreshDashboard();
  }

  function formatDateInput(date) {
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  }

  function editUsage(id) {
    const row = (dashboard.usageRows || []).find((item) => item.id === id);
    if (!row) return;
    switchTab("add");
    const form = document.getElementById("usageForm");
    form.id.value = row.id || "";
    form.serviceDate.value = row.serviceDate || "";
    form.vehicleKey.value = row.assetCode || row.vehicleId || row.plate || "";
    form.driverKey.value = row.driverId || row.driverName || "";
    form.eventType.value = row.eventType || "segment";
    form.odometer.value = row.odometer || "";
    form.odometerStart.value = row.odometerStart || "";
    form.usageType.value = row.usageType || "";
    form.detail.value = row.detail || "";
    form.note.value = row.note || "";
  }

  function editFuel(id) {
    const row = (dashboard.fuelRows || []).find((item) => item.id === id);
    if (!row) return;
    switchTab("add");
    const form = document.getElementById("fuelForm");
    form.id.value = row.id || "";
    form.serviceDate.value = row.serviceDate || "";
    form.vehicleKey.value = row.assetCode || row.vehicleId || row.plate || "";
    form.driverKey.value = row.driverId || row.driverName || "";
    form.odometer.value = row.odometer || "";
    form.fuelType.value = row.fuelType || "";
    form.liters.value = row.liters || "";
    form.amount.value = row.amount || "";
    form.station.value = row.station || "";
    form.receiptNo.value = row.receiptNo || "";
    form.note.value = row.note || "";
  }

  function openUsageForm() {
    switchTab("add");
    document.getElementById("usageForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function openFuelForm() {
    switchTab("add");
    document.getElementById("fuelForm").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetUsageForm() {
    document.getElementById("usageForm").reset();
    document.querySelector('#usageForm input[name="id"]').value = "";
  }

  function resetFuelForm() {
    document.getElementById("fuelForm").reset();
    document.querySelector('#fuelForm input[name="id"]').value = "";
  }

  function switchTab(tabId) {
    document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.tab === tabId));
    document.querySelectorAll(".tab-panel").forEach((panel) => panel.classList.toggle("active", panel.id === tabId));
  }

  function findVehicle(key) {
    return (dashboard.vehicles || []).find((v) => v.assetCode === key || v.plate === key) || {};
  }

  function findDriver(key) {
    return (dashboard.drivers || []).find((d) => d.driverId === key || d.driverName === key) || {};
  }

  function eventLabel(value) {
    return { start: "เริ่มใช้", segment: "ระหว่างวัน", end: "จบงาน", probe: "ทดสอบ" }[value] || value || "-";
  }

  function emptyRow(colspan) {
    return `<tr><td colspan="${colspan}" class="muted">ยังไม่มีข้อมูล</td></tr>`;
  }

  function formatNumber(value) {
    const n = Number(value || 0);
    if (!Number.isFinite(n)) return value || "-";
    return n.toLocaleString("th-TH", { maximumFractionDigits: 2 });
  }

  function lower(value) {
    return String(value || "").toLowerCase();
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[ch]));
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/`/g, "&#096;");
  }

  function toast(message, isError) {
    const el = document.getElementById("toast");
    el.textContent = message;
    el.classList.toggle("error", Boolean(isError));
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3600);
  }

  function setLoading(show) {
    document.getElementById("loading").classList.toggle("show", Boolean(show));
  }
</script>
